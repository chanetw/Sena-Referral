# =============================================================
#  docker-compose.prod.yml
#  ใช้บน Production Server (172.22.22.11)
#  Pull images จาก Docker Hub โดยตรง — ไม่ต้อง build
# =============================================================

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: sena_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: sena_referral
      MYSQL_USER: sena_user
      MYSQL_PASSWORD: sena_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./customer-audit-triggers.sql:/docker-entrypoint-initdb.d/02-triggers.sql
      - ./init-database.sql:/docker-entrypoint-initdb.d/03-sample-data.sql
      - ./backups/sena_referral_current.sql:/docker-entrypoint-initdb.d/04-current-data.sql
    networks:
      - sena_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Backend API — pull จาก Docker Hub
  api:
    image: chanetw/sena-api:latest
    container_name: sena_api
    restart: unless-stopped
    env_file:
      - ./backend/.env.prod
    ports:
      - "4000:4000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sena_network

  # Frontend Web App — pull จาก Docker Hub
  web:
    image: chanetw/sena-web:latest
    container_name: sena_web
    restart: unless-stopped
    env_file:
      - ./frontend/.env.prod
    depends_on:
      - api
    ports:
      - "3000:4173"
    networks:
      - sena_network

  # phpMyAdmin — Database Management
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: sena_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 100M
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sena_network

volumes:
  mysql_data:

networks:
  sena_network:
    driver: bridge
